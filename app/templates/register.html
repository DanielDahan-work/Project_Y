{% extends "base.html" %}

{% block content %}

<div class="col-md-5">

```
<div class="card shadow">

    <div class="card-body">

        <h2 class="text-center mb-4">
            Register
        </h2>

        <form action="/register" method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    required>

            </div>

            <button
                class="btn btn-success w-100"
                type="submit">

                Register

            </button>

        </form>

        <div class="text-center mt-3">

            <a href="/login">
                Already have an account? Login
            </a>

        </div>

    </div>

</div>
```

</div>
