{% extends "base.html" %}

{% block body_class %}app-surface{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-body">

                <h2 class="text-center mb-4">
                    Login
                </h2>

                <form action="/login" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control">

                    </div>

                    <button
                        class="btn btn-primary w-100"
                        type="submit">

                        Login

                    </button>

                </form>
                <p class="mt-3"><a href="{{ url_for('auth.resend_verification') }}">Resend verification email</a></p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
