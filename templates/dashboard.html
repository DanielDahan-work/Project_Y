{% extends "base.html" %}

{% block content %}

<h1 class="mb-5">

    <i class="bi bi-speedometer2 me-2"></i>

    Dashboard

</h1>

<div class="row g-4">

    <div class="col-md-4">

        <div class="card shadow-sm text-center">

            <div class="card-body">

                <i class="bi bi-folder-fill display-4 text-primary"></i>

                <h2 class="mt-3">

                    {{ stats.projects }}

                </h2>

                <p class="text-muted">

                    Projects

                </p>

            </div>

        </div>

    </div>

    <div class="col-md-4">

        <div class="card shadow-sm text-center">

            <div class="card-body">

                <i class="bi bi-server display-4 text-success"></i>

                <h2 class="mt-3">

                    {{ stats.servers }}

                </h2>

                <p class="text-muted">

                    Servers

                </p>

            </div>

        </div>

    </div>

    <div class="col-md-4">

        <div class="card shadow-sm text-center">

            <div class="card-body">

                <i class="bi bi-gear-fill display-4 text-dark"></i>

                <h2 class="mt-3">

                    {{ stats.pipelines }}

                </h2>

                <p class="text-muted">

                    Pipelines

                </p>

            </div>

        </div>

    </div>

</div>

<hr class="my-5">

<h3 class="mb-4">

    Infrastructure Status

</h3>

<div class="list-group">

{% for server in servers %}

<div class="list-group-item d-flex justify-content-between">

    <strong>

        {{ server.name }}

    </strong>

    <span class="badge bg-success">

        {{ server.status }}

    </span>

</div>

{% endfor %}

</div>

{% endblock %}
